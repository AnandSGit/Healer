tdd:
  category: implementation
  purpose: |
    Test-driven development — write failing tests first, then implement
    the minimum code to pass them, then refactor. Red-Green-Refactor cycle.
  what_it_does: |
    Detects test framework, writes failing tests for the next plan task,
    confirms tests fail (red), writes minimum code (green), runs tests,
    refactors with tests still passing. Loops until plan is complete.
  input:
    syntax: /healer:tdd [feature]
    args:
      - name: feature
        desc: Feature to TDD
        required: false
    valid:
      - shopping cart logic
      - user role permissions
    invalid:
      - text: tdd everything
        why: scope unbounded — pick one feature
  example:
    command: /healer:tdd shopping cart logic
    trace:
      - Detects Vitest
      - 'Writes failing test: ''cart.add(item) increments item count'''
      - Confirms RED (test fails as expected)
      - Implements cart.add() with minimal code
      - Runs test → GREEN (passes)
      - Refactors for clarity, re-runs → still GREEN
      - Loops to next test
    why_this_example: |
      Shopping cart has clear unit-testable behaviors; cleanest demo of
      Red-Green-Refactor cycle.
  input_purpose: '[feature] scopes the TDD cycle. Each test → implementation → refactor loop targets one
    behavior at a time; vague features can''t be TDD''d because tests can''t be written for them.'
  next:
    - coverage
    - review
    - push
  related:
    - test
    - implement
  errors:
    - If test framework not detected → asks user before fabricating one
refactor:
  category: implementation
  purpose: |
    Research-augmented refactoring — improves code structure, readability,
