verify:
  category: quality
  purpose: |
    Requirement-driven autonomous verification engine — reads all specs,
    designs, and requirements, traces each through code across 9
    behavioral dimensions, fixes all gaps via sub-command dispatch, and
    loops until every requirement is demonstrably working. The behavioral
    counterpart to /healer:conform.
  what_it_does: |
    Reads upstream artifacts, extracts requirements, traces each through
    code (✅ implemented / ⚠️ partial / ❌ missing), runs targeted tests
    per requirement across 9 dimensions, fixes gaps via dispatch to
    appropriate sub-commands, loops until coverage = 100%.
  input:
    syntax: /healer:verify [scope]
    args:
      - name: scope
        desc: Optional artifact or feature to verify
        required: false
    valid:
      - OAuth2 login
      - docs/specs/2026-04-11-payment.md
    invalid: []
  example:
    command: /healer:verify OAuth2 login
    trace:
      - Reads docs/specs/<latest>-oauth2.md
      - 'Traces 15 requirements through code: 12 implemented, 2 partial, 1 missing'
      - 'Tests each across 9 dimensions: behavior, security, perf, etc.'
      - 'Dispatches: /healer:implement for missing, /healer:fix for partial'
      - 'Loops: re-verifies until 15/15 pass'
    why_this_example: |
      OAuth2 has well-defined requirements that map cleanly to verification
      dimensions; demonstrates dispatch + loop mechanism.
  input_purpose: '[scope] optionally focuses verification. With a feature name, verify reads the relevant
    spec/plan and traces just that feature. With no scope, verifies all artifacts in docs/.'
  next:
    - fix
    - implement
    - test
    - push
    - ship
  related:
    - conform
    - catchup
  errors:
    - If no spec/plan exists → asks if verification proceeds without traceability
    - If loop doesn't converge in 5 iterations → escalates per enforcement protocol
catchup:
  category: quality
  purpose: |
    Full-pipeline gap analysis and auto-fix — reads ALL project artifacts
    (brainstorms, designs, specs, plans, strategies, research), compares
    against implemented code, identifies every gap at every severity
    level, then fixes ALL of them. Zero gaps is the target.
  what_it_does: |
    Reads everything in ~/.healer/ and docs/, compares to current
    codebase, lists every gap with severity, then executes fixes in
    severity order. Loops until zero gaps remain.
  input:
    syntax: /healer:catchup [filter]
    args:
      - name: filter
        desc: Optional severity filter (high|medium|low|all)
        required: false
    valid:
      - high
      - all
    invalid: []
  example:
    command: /healer:catchup high
    trace:
      - Reads 12 artifacts in ~/.healer/ and docs/
      - Identifies 23 gaps total; 7 high-severity
      - Fixes high-severity gaps one at a time, verifies each
      - 'Reports: 7/7 high-severity gaps fixed; 16 medium/low remaining'
    why_this_example: |
      Catchup is the rescue command when artifacts have drifted from
      implementation; high-severity-only is the typical incremental use.
  input_purpose: '[filter] limits which gaps are addressed. Severity filtering lets you fix the urgent
    gaps first without committing to fixing everything in one pass.'
  next:
    - test
    - review
    - implement
    - verify
    - deploy
  related:
    - verify
    - fix
  errors:
    - If no artifacts found → halts (catchup needs source-of-truth artifacts)
imitate:
  category: recording
  purpose: |
    Reverse-engineer a specific layer (frontend, backend, server, db, ai) —
    or the whole app — into a 4-in-1 Requirements + Design + Spec + Plan
    markdown PLUS a machine-readable Style DNA YAML consumed deterministically
    by /healer:adapt. Captures page compositions, visual motifs, chart render
    configs, per-icon styles, branding SVG paths, copy voice, AI response
    patterns, and literal motion values — the dimensions that separate
    "same design family" from "same app feel."
  what_it_does: |
    9-layer discovery with --layer scoping. Frontend layer emits 8 new ID
    prefixes (PC page compositions, VM visual motifs, CH chart renders,
    IC icon usage, BR branding assets, CV copy voice, AR AI response
    patterns, MD motion literals) and a Style DNA YAML with deterministic
    canonical hash. Exhaustive page-composition capture by default
    (--pages=sample escape hatch). Optional --rendered mode opts into
    headless-browser evidence. 10x flags add Mermaid diagrams, risk
    scoring, git timeline, impact analysis, imitate diff, CLAUDE.md
    generation, OpenAPI generation.
  input:
    syntax: /healer:imitate [--layer=<list>] [--style-dna | --no-style-dna] [--pages=exhaustive|sample] [--rendered] [--deep-style] [--full | --risk | --impact <file> | --diff | --claude-md | ...]
    args:
      - name: --layer
        desc: 'Comma-separated layers: frontend, backend, server, db, ai'
        required: false
      - name: --style-dna
        desc: Emit Style DNA YAML (default ON when frontend in scope)
        required: false
      - name: --no-style-dna
        desc: Suppress Style DNA emission
        required: false
      - name: --pages
        desc: 'Page composition scope: exhaustive (default) or sample'
        required: false
      - name: --rendered
        desc: Opt-in to headless-browser rendered evidence
        required: false
      - name: --deep-style
        desc: Alias for --style-dna --pages=exhaustive --rendered
        required: false
      - name: --full
        desc: Enable all 10x flags across all layers
        required: false
      - name: --risk
        desc: Risk scoring per flow
        required: false
      - name: --impact
        desc: Show flows affected by a file
        required: false
      - name: --diff
        desc: Compare against previous imitate
        required: false
      - name: --claude-md
        desc: Generate CLAUDE.md sections
        required: false
    valid:
      - --layer=frontend
      - --layer=frontend --deep-style
      - --layer=backend,db
      - --full --claude-md
      - --pages=sample
      - --no-style-dna
      - --risk
      - --impact src/payment.ts
    invalid:
      - text: --pages=all
        why: invalid enum — use exhaustive or sample
      - text: --rendered --no-style-dna
        why: --rendered requires --style-dna emission
  example:
    command: /healer:imitate --layer=frontend --deep-style
    trace:
      - 'Scope parsed: frontend only, deep-style (exhaustive pages + rendered evidence)'
      - Scans components, pages, state stores, styles, design tokens
      - Scans Step 8.5 deep style dimensions (PC/VM/CH/IC/BR/CV/AR/MD)
      - Extracts CP-NNN primitives, FF-NNN journeys, PC-NNN compositions per route
      - Launches headless browser for computed-CSS evidence per page
      - Emits {App}_Imitate_{MMDDYYYY}.md (human-readable prose)
      - Emits {App}_StyleDNA_{MMDDYYYY}.yaml (machine-readable, schema-validated, canonically hashed)
    why_this_example: |
      --deep-style is the canonical configuration for visual replication.
      It produces a StyleDNA YAML that /healer:adapt consumes deterministically
      to replicate the visual identity onto a target codebase with a fidelity
      score trajectory toward 9-10/10 rather than the 5-6/10 ceiling of
      token-only imitation.
  input_purpose: |
    --layer controls scope. --style-dna (default ON for frontend) emits the
    adapt-consumable YAML. --pages=exhaustive (default) captures every route
    as a PC-NNN composition. --rendered opts into headless-browser evidence.
    --deep-style is the canonical maximum-fidelity configuration.
  next:
    - adapt
    - indulge
    - verify
    - test
    - report
    - analyze
  related:
    - adapt
    - analyze
    - indulge
  errors:
    - If repo too large (>10k files) → recommends incremental scope
    - If --rendered passed without running dev server or static export → halts, asks user to start one
    - If Style DNA fails schema validation during emission → halts with specific violation
adapt:
  category: recording
  purpose: |
    Style DNA consumer and replicator — takes the Style DNA YAML produced
    by /healer:imitate on a source project and applies it deterministically
    to a target codebase. Where imitate is the encoder (code → StyleDNA),
    adapt is the decoder (StyleDNA → code on a new target). Closes the
    "5-6/10 visual fidelity" gap by replicating page compositions, visual
    motifs, chart render configs, per-icon styles, motion literals, and
    tokens — not just tokens and primitives.
  what_it_does: |
    Validates the Style DNA against its schema, scans the target codebase
    for existing tokens/primitives/pages/icons/motion, computes an
    adaptation plan of AD-NNN decisions, CF-NNN conflicts, and GP-NNN
    gaps, then optionally applies it. Three write modes: --plan-only
    (safe; writes only ADAPTATION_PLAN.md), --write-components (DEFAULT;
    writes tokens + primitives + reusable compositions without touching
    pages), --full (also rewrites target pages to echo source PC-NNN
    compositions). Deterministic: same StyleDNA + same target SHA = same
    plan. Emits ADAPTATION_PLAN.md and ADAPTATION_REPORT.md with per-section
    fidelity scores 0-10.
  input:
    syntax: /healer:adapt <path/to/StyleDNA.yaml> [--plan-only | --write-components | --full] [--only=<sections>] [--exclude=<sections>] [--copy-voice] [--branding] [--no-page-wipe] [--dry-run] [--report] [--target-root <path>]
    args:
      - name: style_dna_path
        desc: Path to Style DNA YAML from /healer:imitate
        required: true
      - name: --plan-only
        desc: Emit ADAPTATION_PLAN.md only; no file changes
        required: false
      - name: --write-components
        desc: (DEFAULT) Write tokens + primitives + compositions; skip page rewrites
        required: false
      - name: --full
        desc: Also rewrite target pages to echo source PC-NNN compositions
        required: false
      - name: --only
        desc: 'Comma-separated subset: tokens, motifs, pages, charts, icons, branding, copy_voice, ai_response, motion'
        required: false
      - name: --exclude
        desc: Subtractive opposite of --only (mutually exclusive with it)
        required: false
      - name: --copy-voice
        desc: Apply CV-NNN microcopy to target (OFF by default)
        required: false
      - name: --branding
        desc: Apply BR-NNN branding assets to target (OFF by default)
        required: false
      - name: --no-page-wipe
        desc: With --full, preserve existing page content inside new composition shells
        required: false
      - name: --dry-run
        desc: Print per-file diffs without writing
        required: false
      - name: --report
        desc: Emit ADAPTATION_REPORT.md after apply (default ON unless --plan-only)
        required: false
      - name: --target-root
        desc: Explicit target root path (defaults to CWD)
        required: false
    valid:
      - Prism_StyleDNA_04122026.yaml
      - Prism_StyleDNA_04122026.yaml --plan-only
      - Prism_StyleDNA_04122026.yaml --full --no-page-wipe
      - Prism_StyleDNA_04122026.yaml --only=tokens,motion
      - Prism_StyleDNA_04122026.yaml --exclude=branding,copy_voice
      - Prism_StyleDNA_04122026.yaml --dry-run
    invalid:
      - text: Prism_StyleDNA.yaml --only=tokens --exclude=motion
        why: --only and --exclude are mutually exclusive
      - text: Prism_StyleDNA.yaml --full
        why: --full is dangerous without review; pair with --no-page-wipe unless you truly want to replace pages
      - text: nonexistent.yaml
        why: Style DNA must exist and pass schema validation
  example:
    command: /healer:adapt Prism_StyleDNA_04122026.yaml --write-components --report
    trace:
      - 'Resolves Style DNA path and write mode (write-components, default)'
      - Validates YAML against references/ui-styling/style-dna.md schema
      - Scans target codebase for existing tokens/primitives/pages/icons/motion
      - Computes adaptation plan — AD/CF/GP decisions per StyleDNA section
      - Emits ADAPTATION_PLAN.md with per-section applicability table
      - Applies AD-NNN writes — tokens into target config, primitives scaffolded, compositions templates written
      - Emits ADAPTATION_REPORT.md with per-section fidelity scores
    why_this_example: |
      --write-components is the canonical safe-but-substantial use case —
      gets a target to ~7/10 visual fidelity without rewriting its pages.
      Pages stay as-is; the composition templates are imported by the
      user when they want to echo a specific source page composition.
  input_purpose: |
    The Style DNA path is load-bearing: it IS the contract. Every decision
    adapt makes traces to a field in that YAML. Write mode controls blast
    radius: --plan-only is zero-risk preview, --write-components is the
    default safe-apply, --full is the full rewrite. --only/--exclude let
    users stage adaptations section-by-section. --copy-voice and --branding
    are opt-in because a target app is usually not a clone of the source.
  next:
    - conform
    - design-review
    - implement
    - test
    - push
  related:
    - imitate
    - conform
    - design-review
    - design-system
  errors:
    - If Style DNA fails schema validation → halt with specific violation
    - If --full passed without --no-page-wipe and target has uncommitted page changes → warn before proceeding
    - If --only and --exclude both passed → halt (mutually exclusive)
    - If target stack cannot express a StyleDNA section (e.g., springs on plain-CSS target) → logged as GP-NNN, not an error
indulge:
  category: recording
  purpose: |
    Imitate-driven exhaustive flow testing engine — parses /healer:imitate
    output, systematically tests EVERY discovered flow across 6 dimensions
    (happy path, negative input, boundary cases, permission/auth, state
    violations, data integrity), generates repeatable test files, and
    produces detailed reports.
  what_it_does: |
    Reads the imitate output, generates test files for every flow × 6 dimensions.
    10x flags add: visual regression, accessibility, security, performance,
    regression analysis, CI generation, auto-heal, HTML dashboard, contract
    testing.
  input:
    syntax: /healer:indulge [--full | --security | --visual | --auto-heal | ...]
    args:
      - name: --full
        desc: Enable all 22 flags
        required: false
      - name: --security
        desc: Add security dimension
        required: false
      - name: --visual
        desc: Add visual regression
        required: false
      - name: --auto-heal
        desc: Auto-fix failing flows
        required: false
    valid:
      - --full --dashboard
      - --security --contract
    invalid: []
  example:
    command: /healer:indulge --full --dashboard
    trace:
      - Reads the latest imitate document, finds 47 flows
      - Generates 47 × 6 = 282 test cases
      - Runs them; 264 pass, 18 fail
      - Writes HTML dashboard to indulge-dashboard.html
      - Reports failure clusters by dimension and flow
    why_this_example: |
      --full --dashboard is the canonical comprehensive QA use case;
      exercises all 6 dimensions and produces visible reporting.
  input_purpose: Flags select which testing dimensions and reports to enable. Without flags, base 6-dimension
    testing runs against the latest imitate document. --full + --dashboard is the canonical comprehensive QA configuration.
  next:
    - fix
    - test
    - push
    - report
    - coverage
  related:
    - imitate
    - test
  errors:
    - If no imitate document found → halts (recommend /healer:imitate first)
karpathy:
  category: quality
  purpose: |
    Karpathy-lens code review — checks recent changes against the four
    Karpathy principles (Think Before Coding, Simplicity First, Surgical
    Changes, Goal-Driven Execution) with research-augmented validation.
  what_it_does: |
    Gathers code changes (diff, PR, branch, or files), researches
    principle-specific patterns online, checks every change against
    P1-P4 heuristics with per-principle and per-file reporting, and
    produces a structured Karpathy Report with specific violation
    descriptions and fix recommendations.
  input:
    syntax: /healer:karpathy [target]
    args:
      - name: target
        desc: What to review — diff (default), PR number, branch, file, or "last commit"
        required: false
    valid:
      - /healer:karpathy
      - /healer:karpathy last commit
      - /healer:karpathy src/lib/auth.ts
    invalid:
      - text: /healer:karpathy fix
        why: karpathy reviews, it doesn't fix — use /healer:fix after reviewing
  example:
    command: /healer:karpathy last commit
    trace:
      - 'Runs git diff HEAD~1 to gather last commit changes'
      - 'WebSearches "{pattern} over-engineering" for each concern found'
      - 'Checks 4 files against P1-P4: finds P2 violation (unused abstraction in utils.ts) and P3 violation (reformatted adjacent function in api.ts)'
      - 'Reports: 2 violations across 2 files, P1 ✅, P2 ⚠️, P3 ⚠️, P4 ✅'
      - 'Recommends: inline the abstraction, revert the formatting change'
    why_this_example: |
      "last commit" is the most common use case — quick post-commit
      hygiene check. The example shows both P2 and P3 violations,
      demonstrating the dual per-principle + per-file report format.
  input_purpose: |
    [target] scopes what code to review. Empty means all uncommitted
    changes. Specific targets (file, PR, branch) narrow the review.
    "last commit" is the most common quick-check pattern.
  next:
    - fix
    - implement
    - push
    - review
  related:
    - review
    - refactor
    - verify
  errors:
    - If no changes found → reports "No changes to review" and suggests checking git status
    - If target file doesn't exist → error with suggestion
debug:
  category: debug
  purpose: |
    Systematic debugging — structured troubleshooting with reproducible
    steps, hypothesis testing, and root cause isolation. Never guesses —
    always verifies.
  what_it_does: |
    Iron Law: no fixes without root cause. Phases: investigate, analyze,
    hypothesize, implement. Reproduces the bug, isolates the cause,
    proposes fix only after evidence.
  input:
    syntax: /healer:debug [issue]
    args:
      - name: issue
        desc: Bug description or error message
        required: false
    valid:
      - login redirect loop after session expires
      - 'TypeError: cannot read property ''id'' of undefined in checkout'
    invalid:
      - text: broken
        why: no actionable signal — describe the symptom
  example:
    command: /healer:debug login redirect loop after session expires
    trace:
      - 'Investigate: reproduces with expired session cookie'
      - 'Analyze: traces redirect chain — middleware → /login → middleware'
      - 'Hypothesize: middleware doesn''t clear expired cookie before redirect'
      - Verifies hypothesis with logging
      - 'Proposes fix: clear cookie in middleware before redirect'
    why_this_example: |
      Redirect loops are common but mis-diagnosed; demonstrates the
      no-guess Iron Law and hypothesis-verification cycle.
  input_purpose: '[issue] anchors the debugging investigation. Specific symptoms (error messages, repro
    steps) accelerate hypothesis formation; vague descriptions cause investigation loops on basic clarification.'
  next:
    - fix
    - test
  related:
    - fix
    - diagnose
  errors:
    - If can't reproduce after 3 attempts → halts and asks for repro steps
fix:
  category: debug
  purpose: |
    Research-augmented targeted fix — runs a specific test suite,
    analyzes failures, searches online for error messages and known
    issues, then fixes root causes with max 5 iterations.
  what_it_does: |
    Runs the specified test suite (unit/integration/e2e/types/lint),
    parses failures, researches each unique error online, applies fixes
    one at a time, verifies after each. Halts after 5 iterations or zero
    failures.
  input:
    syntax: /healer:fix <suite>
    args:
      - name: suite
        desc: unit|integration|e2e|types|lint
        required: true
    valid:
      - unit
      - e2e
      - types
    invalid:
      - text: everything
        why: specify a suite — fix is targeted
  example:
    command: /healer:fix unit
    trace:
      - Runs vitest → 3 unit test failures
      - 'Researches first error: ''mock returning undefined'' in vitest 1.x'
      - 'Applies fix: vi.mocked() instead of jest.mocked()'
      - Re-runs → 2 failures remain; iterates
      - 'After iteration 3: 0 failures, halts'
    why_this_example: |
      Vitest migration errors are well-documented online; demonstrates
      research-driven fix vs trial-and-error.
  input_purpose: <suite> selects which test suite to fix. Fix is targeted — it iterates on one suite's
    failures, not all-suite cleanup. For broader cleanup, run /healer:diagnose first to prioritize.
  next:
    - test
    - diagnose
    - push
  related:
    - debug
    - test
  errors:
    - If 5 iterations exhausted → escalates per enforcement protocol
    - If 3 fix attempts on same error fail → escalates
diagnose:
  category: health
  purpose: |
    Read-only health check — runs all test suites sequentially, compares
    error patterns against known framework bugs online, and outputs a
    structured health report. Never modifies any files.
  what_it_does: |
    Detects stack, runs all available checks (tests, lint, types, build,
    e2e), compares failures against known framework issues online,
    outputs a categorized report. Read-only — never writes code.
  input:
    syntax: /healer:diagnose
    args: []
    valid:
      - ''
    invalid: []
  example:
    command: /healer:diagnose
    trace:
      - 'Detects: Next.js 15 + TypeScript + Vitest'
      - 'Runs: tsc (clean), eslint (3 warnings), vitest (2 failures), build (OK)'
      - Researches the 2 failures — both are known Next 15 RSC issues
      - 'Reports: B+ health grade with specific remediation links'
    why_this_example: |
      Diagnose-only workflow is the safest first contact with an unknown
      project; shows the read-only contract and online comparison.
  input_purpose: Diagnose takes no arguments — it scans whatever stack is detected. The output is read-only
    health intel that informs subsequent /healer:fix or /healer:debug invocations.
  next:
    - fix
    - report
    - deploy
  related:
    - report
    - analyze
  errors:
    - If no test commands found → asks user before fabricating any
report:
  category: health
  purpose: |
    Comprehensive status report generator — runs all test suites and
    produces a formal health report with pass/fail counts, error
    summaries, and overall grade.
  what_it_does: |
    Same execution as diagnose but produces a more formal, sharable
    report (markdown + optional HTML). Suited for status updates,
    pre-release checks, and post-incident reviews.
  input:
    syntax: /healer:report [format]
    args:
      - name: format
        desc: markdown|html
        required: false
    valid:
      - ''
      - html
    invalid:
      - text: yaml
        why: format not supported; use markdown or html
  example:
    command: /healer:report html
    trace:
      - Runs all suites
      - Produces health-report.html with charts (Chart.js)
      - 'Includes: pass/fail counts, error summaries, trend vs last report'
    why_this_example: |
      HTML report is the canonical artifact for sharing health status
      with non-engineering stakeholders.
  input_purpose: '[format] selects output format. Markdown is default (good for git/PR review); HTML produces
    a sharable dashboard (good for stakeholders).'
  next:
    - fix
    - deploy
  related:
    - diagnose
    - audit
  errors:
    - If no prior report → first report has no trend comparison (warns)
analyze:
  category: health
  purpose: |
    Analyze codebase health — patterns, tech debt, dependencies, and
    quality compared against industry best practices from online sources.
  what_it_does: |
    Reads codebase, identifies architectural patterns, measures tech debt
    (cyclomatic complexity, file size, coupling), audits dependencies for
    age/maintenance, compares against industry standards. Outputs
    refactor priority list.
  input:
    syntax: /healer:analyze [scope]
    args:
      - name: scope
        desc: Optional directory or module to focus on
        required: false
    valid:
      - src/payments/
      - ''
    invalid: []
  example:
    command: /healer:analyze src/payments/
    trace:
      - 'Measures: 5 files, avg complexity 8, max 24 (refund.ts is god class)'
      - 'Dependencies: stripe SDK 1 major version behind'
      - 'Coupling: payments.ts imports from 7 different layers'
      - Outputs prioritized refactor list with rationale
    why_this_example: |
      Payment modules accrete complexity; analyze surfaces the typical
      god-class + outdated-SDK + over-coupling triple.
  input_purpose: '[scope] focuses analysis. Targeted analysis (one module) gives actionable refactor priorities;
    full-codebase analysis can overwhelm.'
  next:
    - refactor
    - audit
    - fix
  related:
    - audit
    - refactor
  errors:
    - If repo too large → suggests scoped analysis
push:
  category: shipping
  purpose: |
    Research-augmented commit and push — stages changes, generates a
    conventional commit message with emoji prefix, and pushes to the
    current branch.
  what_it_does: |
    Reads the diff, generates a conventional commit message (feat/fix/
    chore/docs), prefixes with the appropriate emoji, commits, and
    pushes to origin/<current-branch>.
  input:
    syntax: /healer:push [message-hint]
    args:
      - name: message-hint
        desc: Optional human hint for the commit message
        required: false
    valid:
      - fixed OAuth2 callback bug
      - ''
    invalid: []
  example:
    command: /healer:push
    trace:
      - 'Reads git diff: 3 files modified in src/auth/'
      - 'Infers type: fix (callback handler change)'
      - 'Generates message: ''🐛 fix(auth): handle OAuth2 callback edge cases'''
      - Commits and pushes to origin/feature/oauth2
    why_this_example: |
      Standard fix workflow — diff inspection drives message inference,
      no manual writing.
  input_purpose: '[message-hint] optionally guides the commit message. Without it, push infers from diff.
    With a hint, push uses it as the human context for the conventional commit body.'
  next:
    - ship
    - deploy
  related:
    - ship
    - commit
  errors:
    - If no changes staged or unstaged → halts (nothing to push)
    - If branch is main and not local-only → asks before push
ship:
  category: shipping
  purpose: |
    Complete PR workflow — branch, commit, push, create PR, wait for
    auto-reviewers, resolve all comments in a loop, merge, deploy with
    rollback. End-to-end from code to production.
  what_it_does: |
    Detects/creates branch, commits, pushes, creates PR via gh CLI,
    waits for CI + auto-reviewers, resolves comments iteratively,
    merges (squash by default), deploys to production, monitors for
    rollback signals.
  input:
    syntax: /healer:ship [pr-title]
    args:
      - name: pr-title
        desc: Optional PR title (auto-generated if missing)
        required: false
    valid:
      - 'feat: OAuth2 login support'
      - ''
    invalid: []
  example:
    command: '/healer:ship feat: OAuth2 login support'
    trace:
      - Creates branch feat/oauth2-login (if needed)
      - Commits with conventional message
      - Pushes and creates PR via gh CLI
      - Waits for CI; resolves 4 review comments in a loop
      - Merges (squash), deploys to staging then production
      - Monitors error rate for 5 minutes; OK
    why_this_example: |
      Ship is the canonical zero-touch path from code to production;
      demonstrates the full merge → deploy → monitor cycle.
  input_purpose: '[pr-title] becomes the PR title at GitHub. Without it, ship infers from the most recent
    commit message. The PR title also drives the merge-commit subject (squash strategy).'
  next: []
  related:
    - push
    - deploy
  errors:
    - If CI fails → halts at must-pass gate
    - If post-deploy error rate spikes → triggers rollback automatically
deploy:
  category: shipping
  purpose: |
    Research-augmented production deployment — runs all test suites as a
    gate check, deploys to the detected platform, and runs post-deploy
    smoke tests.
  what_it_does: |
    Detects deploy platform (Vercel/Fly/Render/Netlify/etc.), runs all
    tests as a pre-deploy gate, deploys, runs smoke tests on the live
    URL, monitors for the first 5 minutes, prepares rollback if needed.
  input:
    syntax: /healer:deploy [environment]
    args:
      - name: environment
        desc: production|staging|preview
        required: false
    valid:
      - production
      - staging
    invalid:
      - text: wherever
        why: specify environment explicitly
  example:
    command: /healer:deploy production
    trace:
      - 'Pre-deploy gate: runs full test suite — passes'
      - Detects Vercel; runs vercel --prod
      - 'Smoke tests: GET /, GET /api/health, login flow'
      - Monitors error rate for 5 min — within baseline
    why_this_example: |
      Production deploy with smoke tests is the safe pattern; shows
      gate + deploy + verify cycle.
  input_purpose: '[environment] selects deploy target. Production runs the strictest pre-deploy gate;
    staging/preview have lighter checks.'
  next: []
  related:
    - ship
    - push
  errors:
    - If pre-deploy gate fails → halts (must-pass)
    - If smoke tests fail post-deploy → triggers rollback
docs:
  category: shipping
  purpose: |
    Research-augmented documentation generation — auto-generates README,
    API docs, architecture docs, component docs, and setup guides by
    analyzing code and comparing against best-in-class open source
    documentation.
  what_it_does: |
    Reads the codebase, identifies undocumented or poorly documented
    areas, researches best-in-class documentation patterns from popular
    OSS projects, generates updated docs (README, API, architecture,
    components, setup).
  input:
    syntax: /healer:docs [target]
    args:
      - name: target
        desc: readme|api|architecture|components|all
        required: false
    valid:
      - readme
      - api
      - all
    invalid:
      - text: make docs better
        why: specify target — too broad
  example:
    command: /healer:docs api
    trace:
      - Reads route handlers, extracts endpoints, params, responses
      - Researches API doc patterns (OpenAPI, JSDoc, conventional sections)
      - Generates docs/api.md with endpoint table + examples
    why_this_example: |
      API docs benefit most from research (multiple conventions exist);
      auto-generation from code is reliable when the conventions are clear.
  input_purpose: '[target] selects which doc surface to update. Targeted docs (api, components) are accurate;
    ''all'' is more risky as it touches every documentation file.'
  next:
    - push
  related:
    - readme
    - ship
  errors:
    - If unclear which framework convention to follow → asks user
add-command:
  category: help
  purpose: |
    Atomic scaffolder for new healer commands — interactively prompts
    for all metadata, writes commands/<name>.md AND data/commands.yaml
    entry in one operation, runs validation, rebuilds index. Eliminates
    drift risk from manual two-place updates.
  what_it_does: |
    Validates the new command name, takes a pre-flight backup, prompts
    for the six required catalog sections (category, purpose, what_it_does,
    input, example, input_purpose), then atomically writes both files.
    Runs the build script for validation; rolls back on failure.
  input:
    syntax: /healer:add-command <name>
    args:
      - name: name
        desc: New command name in kebab-case
        required: true
    valid:
      - gen-sdk
      - lint-fix
    invalid:
      - text: GenSDK
        why: must be kebab-case (lowercase + hyphens)
      - text: 1-thing
        why: must start with a letter
      - text: implement
        why: name already taken — pick a unique name
  example:
    command: /healer:add-command gen-sdk
    trace:
      - Validates name 'gen-sdk' (format OK, no conflict)
      - 'Pre-flight backup: cp data/commands.yaml /tmp/commands.yaml.preadd-<ts>'
      - Prompts for category, purpose, what_it_does, input, example, etc.
      - Writes commands/gen-sdk.md (procedure stub) + appends to commands.yaml
      - Runs build-help-index.sh → validates schema, rebuilds index, updates README
      - Reports success with try-it commands
    why_this_example: |
      gen-sdk is a typical net-new tool addition; demonstrates the full
      atomic-create cycle including the prompt loop and verification.
  input_purpose: |
    The <name> argument is the kebab-case identifier used in BOTH the
    markdown filename and the YAML key. It must be valid and unique;
    everything else is collected interactively.
  next:
    - implement
    - push
  related:
    - help
    - flow
  errors:
    - If name format invalid → halts before any write
    - If name already taken → halts; suggests checking with /healer:help <name>
    - If build script fails after writes → automatic rollback restores pre-flight state
