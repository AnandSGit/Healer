  purpose: |
    Test coverage analysis — identifies untested critical paths, measures
    coverage gaps, and prioritizes what to test next based on risk and
    impact.
  what_it_does: |
    Runs coverage tooling, identifies gaps, ranks them by risk (production
    code paths, error handlers, security-relevant code), and produces a
    prioritized "test-next" list.
  input:
    syntax: /healer:coverage [target]
    args:
      - name: target
        desc: Optional file or module to focus on
        required: false
    valid:
      - src/auth/
      - ''
    invalid: []
  example:
    command: /healer:coverage src/auth/
    trace:
      - Runs coverage tool (vitest --coverage)
      - 'Reports: 67% line, 42% branch coverage in src/auth/'
      - 'Critical gap: 0% coverage on src/auth/refresh-token.ts (production code)'
      - Prioritized next-tests list with risk rationale
    why_this_example: |
      Auth code is high-risk; coverage gaps there are urgent. Demonstrates
      risk-weighted prioritization vs raw coverage chasing.
  input_purpose: '[target] optionally focuses the analysis. With no target, full-codebase coverage runs.
    Targeted coverage is faster and surfaces gaps in specific high-risk areas.'
  next:
    - test
    - fix
  related:
    - test
    - audit
  errors:
