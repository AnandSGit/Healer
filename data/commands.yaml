    command: /healer:refactor src/api/users.ts
    trace:
      - Reads file, detects code smells (long function, deep nesting)
      - 'Researches refactor patterns: extract method, replace conditional with polymorphism'
      - Applies extract method on the longest function
      - Runs full test suite — verifies green
      - Reports diff and impact
    why_this_example: |
      Single-file refactor is bounded, verifiable, and exposes the
      fix-verify cycle clearly.
  input_purpose: '[target] is the refactor scope (file, function, or module). Bounded scope is essential
    — refactoring requires running the test suite to verify each change doesn''t regress, and an unbounded
    scope makes verification impossible.'
  next:
    - test
    - review
    - push
  related:
    - implement
    - optimize
  errors:
    - If no test coverage → halts and recommends /healer:test first
optimize:
  category: implementation
  purpose: |
    Research-augmented performance investigation — 10-phase structured
    workflow with baselines, profiling, hypothesis testing, controlled
    experiments, and evidence-backed optimization. Stores baseline
    artifacts for tracking over time.
  what_it_does: |
    Establishes baseline metrics, profiles to find hot paths, generates
    hypotheses, runs controlled experiments (one change at a time),
    measures impact, applies winners. Stores baselines in .healer/perf/.
  input:
    syntax: /healer:optimize [target]
    args:
      - name: target
        desc: Performance target (route, query, function)
        required: false
    valid:
      - /api/dashboard endpoint
      - Postgres query for orders
    invalid:
      - text: make it faster
        why: no measurable target — need a specific scope
  example:
    command: /healer:optimize /api/dashboard endpoint
    trace:
      - 'Establishes baseline: p50=240ms, p95=850ms, p99=2100ms'
      - 'Profiles: 60% of time in DB query, 25% in JSON serialization'
      - 'Hypotheses: missing index, N+1 queries, unnecessary fields'
      - Tests one at a time; missing index → p95=180ms (winner)
      - Stores baseline + improvement in .healer/perf/dashboard-2026-04-11.json
    why_this_example: |
      Endpoint optimization exposes the full 10-phase rigor; controlled
      experimentation prevents superstition-driven optimization.
  input_purpose: '[target] must be measurable (route, query, function). Without a specific target, baselines
    can''t be established and improvements can''t be proven.'
  next:
    - test
    - review
    - push
  related:
    - refactor
    - analyze
  errors:
    - If baseline not establishable → halts (cannot prove improvement)
