      - Writes src/auth/oauth.ts task-by-task; verifies each task
      - Reports tasks completed with file:line evidence
    why_this_example: |
      OAuth2 has well-documented reference implementations on GitHub —
      research substantially improves output vs writing from scratch.
  input_purpose: '[feature] is implementation subject. Best results come from passing a plan reference
    (e.g., docs/plans/<file>.md) — the plan provides the task list and acceptance criteria. With no plan,
    implement asks before proceeding.'
  next:
    - verify
    - test
    - conform
    - review
    - push
  related:
    - tdd
    - refactor
  errors:
