# Healer Command Catalog — Source of Truth for Postfix `?` Help
# ────────────────────────────────────────────────────────────────
# Schema: data/schema/command.schema.json
# Build:  scripts/build-help-index.sh
# Hook:   hooks/hooks.json (PostToolUse on Write|Edit)
#
# To add a new command: prefer /healer:add-command <name> (atomic).
# Manual edits to this file MUST keep bijection with commands/*.md.

brainstorm:
  category: ideation
  purpose: |
    Interactive Socratic brainstorming — explores requirements through
    structured dialogue first, then researches online for inspiration,
    competing approaches, and real-world lessons. Combines interactive
    discovery with research-augmented proposals. Persists decisions to
    ~/.healer/brainstorms/ for cross-session continuity.
  what_it_does: |
    Asks a mode-detection question, runs Socratic discovery rounds,
    proposes 3+ divergent approaches with tradeoffs, surfaces hidden
    assumptions via WebSearch on failure modes, and writes a brainstorm
    artifact to ~/.healer/brainstorms/ that downstream commands consume.
  input:
    syntax: /healer:brainstorm [topic]
    args:
      - name: topic
        desc: Subject to explore (5–10 words preferred)
        required: false
    valid:
      - user authentication with OAuth2
      - payment retry strategy under network failures
      - real-time collaboration cursor presence
    invalid:
      - text: auth
        why: too vague — no domain context to seed Socratic questions
      - text: fix the thing
        why: not exploratory; use /healer:debug or /healer:fix
      - text: build app
        why: scope unbounded — narrow to one feature first
  example:
    command: /healer:brainstorm payment retry strategy under network failures
    trace:
      - 'Asks mode: A startup / B builder / C learning / D hackathon — sets question intensity'
      - 'Asks: ''What''s idempotency guarantee — at-least-once or exactly-once?'''
      - 'Proposes 3 approaches: exponential backoff with jitter, dead-letter queue, saga pattern'
      - WebSearches 'payment retry failed postmortem' for negative cases
      - 'Surfaces assumption: ''You said network failure — what about partial provider failures?'''
      - Writes ~/.healer/brainstorms/payment-retry-2026-04-11.md with decisions and open questions
    why_this_example: |
      Payment retry exposes the full Socratic loop — semantic ambiguity
      (idempotency), divergent design space (3 patterns), hidden
      assumptions (partial vs total failure), and high-stakes consequences
      that justify negative research.
  input_purpose: |
    [topic] seeds the Socratic question generator and downstream artifacts.
    Specific topics yield specific, valuable questions; vague topics force
    a clarification loop that wastes the session. The topic also becomes
    the brainstorm document title, the seed for /healer:research queries,
    and the input passed forward to /healer:plan or /healer:design.
  next:
    - plan
    - design
    - architect
    - spec
    - strategy
  related:
    - validate
    - research
  errors:
    - If topic missing → asks user to provide one; will not start blind
    - If topic too vague → asks for narrowing before proceeding
    - If user picks Startup mode → engages anti-sycophancy + demand validation
flow:
  category: core
  purpose: |
    Flow orchestrator — chains multiple healer sub-commands into pipelines
    with gate controls, 26 built-in presets, custom YAML recipes, and
    smart next-step suggestions. The conductor of the healer orchestra.
  what_it_does: |
    Parses the user's flow expression (preset name, inline chain, or recipe),
    presents the parsed steps for confirmation, then executes each
    sub-command's COMPLETE procedure in order. Writes state after each step
    to .healer/state.json for resumability. Enforces gate semantics:
    auto (continue), interactive (ask), must-pass (halt on failure).
  input:
    syntax: /healer:flow <preset|recipe|inline-chain> [topic]
    args:
      - name: preset
        desc: Built-in preset name (e.g., feature, fix, ideate)
        required: false
      - name: recipe
        desc: Custom recipe from ~/.healer/recipes.yaml
        required: false
      - name: topic
        desc: Optional topic passed to first step
        required: false
    valid:
      - feature OAuth2 authentication
      - fix
      - ideate self-validating help system
      - brainstorm → plan → implement → test
    invalid:
      - text: ghost-preset
        why: unknown preset; will suggest closest match
      - text: → → →
        why: empty step chain
  example:
    command: /healer:flow feature OAuth2 authentication
    trace:
      - Parses 'feature' preset → 6-step pipeline with mixed gates
      - 'Step 1: brainstorm OAuth2 authentication (interactive gate, asks user to approve)'
      - 'Step 2: plan (interactive gate after approval)'
      - 'Step 3: implement (auto-continue)'
      - 'Step 4: test (must-pass — halts if any test fails)'
      - 'Step 5: review (interactive gate)'
      - 'Step 6: ship (must-pass — halts if CI/deploy fails)'
      - 'After each step: writes .healer/state.json so flow is resumable'
    why_this_example: |
      The 'feature' preset is the canonical end-to-end use case, exercising
      all three gate types (auto, interactive, must-pass), state persistence,
      and full sub-command procedures. If feature works, all simpler flows work.
  input_purpose: |
    The preset/recipe/chain selects WHICH commands run and in WHAT order.
    The optional [topic] is forwarded to the first step's $ARGUMENTS,
    becoming brainstorm seed → plan title → branch name → PR title as it
    flows through downstream steps. With no args, the command checks
    .healer/state.json to either resume an interrupted flow or suggest one.
  next: []
  related:
    - healer
    - help
  errors:
    - Unknown preset → suggests closest match via Levenshtein
    - must-pass gate failure → HALTS flow, does not prompt continue
    - Recipe YAML malformed → prints line number, does not start
help:
  category: help
  purpose: |
    Interactive help system — list commands, flows, recipes, gates, examples,
    and get detailed help for any healer sub-command. Now complemented by
    the postfix `?` interceptor for instant per-command drill-down.
  what_it_does: |
    Parses the help mode argument and renders the corresponding help panel:
    overview (default), commands, flows, recipes, gates, examples,
    quickstart, search, all, or detail-for-a-specific-command. Reads
    data/help-index.json for fast rendering.
  input:
    syntax: /healer:help [mode|command-name|search-term]
    args:
      - name: mode
        desc: overview|commands|flows|recipes|gates|examples|quickstart|all
        required: false
      - name: command-name
        desc: Detail mode for a specific command
        required: false
      - name: search-term
        desc: Substring search across catalog
        required: false
    valid:
      - commands
      - flow
      - search verify
      - quickstart
    invalid:
      - text: garbage-input-xyz
        why: no matching mode/command/search hit; renders 'unknown' panel with suggestions
  example:
    command: /healer:help search verify
    trace:
      - Detects 'search' mode with term 'verify'
      - Loads data/help-index.json
      - Searches command names, descriptions, and procedure steps
      - 'Returns: /healer:verify, /healer:full-verify (flow), /healer:pre-ship (flow)'
      - Renders match panel with command + line where match occurred
    why_this_example: |
      Search mode demonstrates the structured-query benefit of having a
      data-backed catalog — O(1) lookup vs grep across 14k lines.
  input_purpose: |
    The argument selects which help mode renders. With no args, the user
    sees the welcome overview. With a known command name, they get
    detail mode (six-section drill-down — same as `/healer:<cmd> ?`).
    With anything else, the system attempts search before falling back
    to a not-found panel.
  next: []
  related:
    - flow
    - healer
  errors:
    - data/help-index.json missing → falls back to dynamic read with warning
    - Unknown mode/command → renders 'unknown' panel with closest matches
healer:
  category: core
  purpose: |
    Full autonomous codebase engine — discover, understand, assess,
    research, plan, execute, and verify any project in any language on
    any platform. The umbrella command that orchestrates the full healer
    suite (41 sub-commands, 26 flow presets, design intelligence,
    10x imitate & flow testing).
  what_it_does: |
    Detects project stack, runs assessment, identifies issues, researches
    fixes online, applies them, and verifies via tests. Supports modes:
    --check (assessment only), --learn (research mode), --implement
    (feature from scratch), --ref (use external URL as inspiration).
  input:
    syntax: /healer [--check | --learn <topic> | --implement <feature> | --ref <url>]
    args:
      - name: --check
        desc: Assessment-only mode (no changes)
        required: false
      - name: --learn
        desc: Research mode for a topic
        required: false
      - name: --implement
        desc: Build a feature from scratch
        required: false
      - name: --ref
        desc: Use external URL as design/code reference
        required: false
    valid:
      - --check
      - --implement onboarding flow
      - --learn React Server Components
    invalid:
      - text: --unknown
        why: no such mode; use one of the documented flags
  example:
    command: /healer --check
    trace:
      - Detects stack (e.g., Next.js 15 + TypeScript + Vitest)
      - 'Runs assessment: tests, lint, types, build'
      - Reports issues found with severity ranking
      - Does NOT modify any code (assessment-only)
    why_this_example: |
      --check is the safest entry point — read-only assessment that
      builds confidence in the heal mechanics before granting write access.
  input_purpose: |
    The flag selects which heal mode runs. With no flags, full autonomous
    heal runs (assess → research → fix → verify). The optional payload
    after --learn / --implement / --ref is forwarded to the relevant
    sub-command (research/implement/design respectively).
  next:
    - diagnose
    - flow
    - report
  related:
    - flow
    - help
  errors:
    - If no project detected → asks user for project root
    - If 3 fix attempts fail on same issue → escalates per enforcement protocol
validate:
  category: ideation
  purpose: |
    Demand validation diagnostic — challenges whether the idea is worth
    building using YC-style forcing questions, The Mom Test principles,
    lean startup validation, and anti-sycophancy rules. Use BEFORE
    brainstorming for new products; skip for internal tooling with
    self-evident need.
  what_it_does: |
    Asks 6 forcing questions: demand reality, status quo, desperate
    specificity, narrowest wedge, observation, future-fit. Engages
    anti-sycophancy mode — every assumption is challenged. Writes a
    validation artifact to ~/.healer/validations/.
  input:
    syntax: /healer:validate [idea]
    args:
      - name: idea
        desc: Product or feature idea to validate
        required: false
    valid:
      - B2B SaaS for restaurant inventory
      - AI-powered code review tool
    invalid:
      - text: make money
        why: not an idea — needs problem framing
  example:
    command: /healer:validate B2B SaaS for restaurant inventory
    trace:
      - 'Q1: Who specifically would buy this and what would they pay?'
      - 'Q2: What do they do today instead — and why is your solution 10x?'
      - 'Q3: Have you talked to 5 of them? What did they actually say?'
      - 'Surfaces: ''They use spreadsheets — your wedge isn''t 10x, it''s 2x'''
      - 'Recommendation: narrow wedge OR pivot OR don''t build'
    why_this_example: |
      Restaurant inventory exposes the typical SaaS-validation traps —
      vague target, unverified pain, weak wedge — making the diagnostic
      work obvious.
  input_purpose: |
    The [idea] anchors the forcing questions. Vague ideas fail Q1 immediately
    (no specific buyer). Specific ideas reveal whether a real wedge exists.
    The validation artifact feeds into /healer:brainstorm as a constraint set.
  next:
    - brainstorm
    - research
  related:
    - brainstorm
    - strategy
  errors:
    - If user gives sycophantic answers → command counter-challenges
    - If no specific buyer named after Q3 → recommends pivot or stop
research:
  category: ideation
  purpose: |
    Deep research on a topic, technology, market, or approach — fetches
    docs, repos, articles, competitor intel, and community insights.
    Saves artifacts for cross-session reuse so you don't research the
    same thing twice.
  what_it_does: |
    Uses Context7 first (authoritative docs), then WebSearch (best
    practices, postmortems, comparisons), then WebFetch (deep reading).
    Synthesizes findings into a research brief. Modes: --technical
    (engineering depth), --product (market depth), --deep (both),
    --quick (one-pass summary).
  input:
    syntax: /healer:research [topic] [--technical|--product|--deep|--quick]
    args:
      - name: topic
        desc: Subject to research
        required: true
      - name: mode
        desc: Research depth/angle
        required: false
    valid:
      - WebSocket scaling at 100k connections --technical
      - B2B SaaS pricing strategies --product
      - OAuth2 vs OIDC --quick
    invalid:
      - text: ''
        why: topic required — research has no subject
  example:
    command: /healer:research WebSocket scaling at 100k connections --technical
    trace:
      - 'Context7: queries socket.io, ws library docs'
      - 'WebSearch: ''WebSocket 100k connections postmortem'' + best practices'
      - 'WebFetch: reads top 3 results in depth (Discord scaling, Slack RT)'
      - 'Synthesizes research brief with: patterns, anti-patterns, benchmarks'
      - Writes ~/.healer/research/websocket-100k-scale.md
    why_this_example: |
      WebSocket scaling has well-documented postmortems and clear technical
      patterns — exposes the full research pipeline (Context7 + Web + Fetch).
  input_purpose: |
    The [topic] is forwarded to all three research tools. The mode flag
    biases the source mix (--product favors competitor intel and market
    blogs; --technical favors GitHub repos and engineering blogs).
  next:
    - brainstorm
    - design
    - implement
  related:
    - brainstorm
    - design
  errors:
    - If Context7 unavailable → falls back to WebSearch with note
    - If <3 quality sources found → reports thin coverage rather than hallucinating
design:
  category: ideation
  purpose: |
    Research-augmented feature design — APIs, data models, UX flows,
    visual design systems, and HTML previews inspired by public design
    systems, pattern libraries, and real-world examples.
  what_it_does: |
    Reads any upstream brainstorm/research artifacts, queries design
    intelligence (161 palettes, 57 fonts, 99 UX rules), then produces
    a design doc with API contracts, data models, UX flows, and
    optional HTML preview pages. Writes to docs/designs/<date>-<topic>.md.
  input:
    syntax: /healer:design [feature]
    args:
      - name: feature
        desc: Feature to design (often passed from brainstorm)
        required: false
    valid:
      - REST API for users with role-based access
      - checkout flow with Apple Pay
    invalid:
      - text: design something
        why: no specific feature to design
  example:
    command: /healer:design REST API for users with role-based access
    trace:
      - Reads brainstorm artifact if present
      - 'Queries design intelligence: REST best practices, RBAC patterns'
      - 'Produces: endpoint table, request/response schemas, error catalog'
      - Writes docs/designs/2026-04-11-users-rbac-api.md with traceability
    why_this_example: |
      RBAC API exercises the full design pipeline — schema design, error
      modeling, security considerations, and traceability to upstream.
  input_purpose: |
    [feature] is the design subject. Inherits constraints from brainstorm
    artifacts when present. Forwarded to /healer:spec or /healer:implement
    downstream — design fidelity carries through.
  next:
    - spec
    - architect
    - implement
    - design-review
  related:
    - architect
    - spec
    - design-system
  errors:
    - If UI design and no DESIGN.md exists → suggests /healer:design-system first
architect:
  category: ideation
  purpose: |
    Research-augmented system architecture — service boundaries,
    infrastructure, scalability patterns, cost estimation, failure mode
    analysis, and security architecture informed by public postmortems,
    tech blogs, and current documentation.
  what_it_does: |
    Defines service boundaries, picks infrastructure components, models
    failure modes, estimates cost at scale, and produces an architecture
    doc with diagrams (Mermaid). Researches public postmortems before
    finalizing.
  input:
    syntax: /healer:architect [system]
    args:
      - name: system
        desc: System to architect
        required: true
    valid:
      - microservices for e-commerce checkout
      - real-time analytics ingestion at 1M events/sec
    invalid:
      - text: an app
        why: scope too broad — needs subsystem framing
  example:
    command: /healer:architect real-time analytics ingestion at 1M events/sec
    trace:
      - 'Researches: Kafka vs Kinesis vs Pulsar at this scale'
      - 'Reads postmortems: Twitter ingestion outages, Slack realtime issues'
      - 'Defines: ingestion → buffer → fan-out → cold storage layers'
      - 'Estimates cost: $X/month at 1M events/sec on AWS'
      - Writes docs/designs/<date>-analytics-architecture.md with Mermaid diagrams
    why_this_example: |
      1M events/sec is the threshold where naive architectures break;
      forces explicit scaling decisions and failure mode analysis.
  input_purpose: '[system] anchors the architecture work. Specific scale/scope produces concrete decisions;
    vague systems produce vague architectures. The output (with diagrams) feeds /healer:spec or /healer:design.'
  next:
    - spec
    - design
    - plan
  related:
    - design
    - spec
  errors:
    - If scale not specified → asks for scale assumptions before proposing
spec:
  category: ideation
  purpose: |
    Write detailed technical specifications — with acceptance tests, API
    contracts, error catalogs, traceability matrices, and non-functional
    requirements. Cross-referenced with public RFCs, ADRs, prior healer
    artifacts, and current library docs via Context7.
  what_it_does: |
    Reads upstream artifacts (brainstorm, research, design), produces
    FRs, NFRs, ATs, edge case catalog, and a traceability matrix that
    maps each acceptance test back to its source requirement.
  input:
    syntax: /healer:spec [feature]
    args:
      - name: feature
        desc: Feature to spec
        required: false
    valid:
      - GraphQL subscriptions with auth
      - payment retry under partial failure
    invalid:
      - text: everything
        why: specs are scoped — pick one feature
  example:
    command: /healer:spec GraphQL subscriptions with auth
    trace:
      - 'Context7: queries graphql-ws, Apollo subscription docs'
      - 'Defines FRs: subscribe, unsubscribe, auth check on each event'
      - 'Defines NFRs: <100ms event latency, 10k concurrent subs'
      - Lists 15 acceptance tests with concrete assertions
      - Writes docs/specs/<date>-graphql-subs.md with traceability matrix
    why_this_example: |
      GraphQL subs have nuanced auth/lifecycle/error semantics — full
      spec work pays off (you can't TDD this from a vague description).
  input_purpose: |
    [feature] anchors the spec. Inherits decisions from upstream artifacts
    and adds the rigor needed before /healer:plan can produce executable
    tasks. The traceability matrix is consumed by /healer:verify later.
  next:
    - plan
    - implement
  related:
    - design
    - architect
  errors:
    - If no upstream artifacts → asks if spec is built from scratch (allowed but flagged)
plan:
  category: ideation
  purpose: |
    Research-augmented implementation planning — creates bite-sized task
    lists with dependency tracking, file mapping, requirement traceability,
    effort estimation, review checkpoints, verification protocol, and
    native task integration. Produces a reusable plan document with
    persistent memory.
  what_it_does: |
    Reads all upstream artifacts, breaks the work into tasks (≤60 min
    each), maps each task to specific files, declares dependencies, and
    writes docs/plans/<date>-<topic>.md. Each task references the
    acceptance tests it satisfies.
  input:
    syntax: /healer:plan [feature]
    args:
      - name: feature
        desc: Feature to plan
        required: false
    valid:
      - OAuth2 login
      - checkout retry logic
    invalid:
      - text: improve everything
        why: scope unbounded — won't produce executable tasks
  example:
    command: /healer:plan OAuth2 login
    trace:
      - Reads docs/specs/<latest>-oauth2.md if present
      - 'Generates 12-20 tasks: schema, middleware, callback, tests'
      - Maps each task to file paths (src/auth/oauth.ts:NEW, etc.)
      - Declares dependencies (T2 blocks T3, T1 parallel with T4)
      - Writes docs/plans/<date>-oauth2.md with phases and verification
    why_this_example: |
      OAuth2 has clear sub-components (authorize, token exchange, refresh,
      logout) that map cleanly to bite-sized tasks with dependencies.
  input_purpose: |
    [feature] becomes the plan title and seeds task generation. The plan
    is the final pre-execution artifact — its quality determines whether
    /healer:implement can proceed without additional questions.
  next:
    - implement
    - tdd
  related:
    - spec
    - implement
  errors:
    - If task estimates >60min each → re-prompts to break down further
strategy:
  category: ideation
  purpose: |
    CEO-level strategic review — evaluates plans and designs for scope
    fitness, dangerous assumptions, 10x thinking, competitor landscape,
    and vitamin-vs-painkiller analysis. Use after brainstorming, before
    implementation.
  what_it_does: |
    Challenges scope (too small? too big?), tests assumptions (likely
    failure modes), proposes the 10x version (not just 1x), maps
    competitive landscape, and classifies as vitamin or painkiller.
    Outputs go/no-go with reasoning.
  input:
    syntax: /healer:strategy [plan-or-design]
    args:
      - name: plan-or-design
        desc: Reference to upstream artifact
        required: false
    valid:
      - docs/plans/2026-04-11-payment-retry.md
      - OAuth2 implementation
    invalid:
      - text: give me strategy
        why: no artifact or topic to review
  example:
    command: /healer:strategy docs/plans/2026-04-11-payment-retry.md
    trace:
      - Reads the plan, identifies scope and assumptions
      - 'Tests assumptions: ''You assume providers retry; some don''t'''
      - 'Proposes 10x: ''Add a saga pattern — handles non-idempotent providers'''
      - 'Vitamin/painkiller: confirms painkiller (real money lost on failures)'
      - 'Verdict: GO with scope expansion to include saga'
    why_this_example: |
      Payment retry is exactly where strategy review pays off — naive
      scope ships, but the 10x version handles edge cases that ship-or-die.
  input_purpose: |
    The artifact reference (or topic) is what gets reviewed. With no
    input, strategy reviews the most recent plan in docs/plans/.
  next:
    - plan
    - spec
    - implement
  related:
    - validate
    - brainstorm
  errors:
    - If no plan/design found → suggests /healer:plan or /healer:design first
brand:
  category: design-intel
  purpose: |
    Brand framework generator — creates brand voice, visual identity
    direction, messaging architecture, and asset guidelines. Produces
    brand-guidelines.md as the project's brand source of truth.
  what_it_does: |
    Asks brand discovery questions (audience, positioning, tone),
    proposes voice spectrum, recommends color/font directions from
    the design intelligence database (161 palettes, 57 fonts), and
    writes brand-guidelines.md.
  input:
    syntax: /healer:brand [product-or-company]
    args:
      - name: product-or-company
        desc: Brand subject
        required: false
    valid:
      - HearthHut — community kitchen platform
      - DevTool startup, B2B audience
    invalid:
      - text: make a brand
        why: no subject — what brand?
  example:
    command: /healer:brand HearthHut — community kitchen platform
    trace:
      - 'Asks: who is the target user? What feeling should they get?'
      - 'Proposes voice: warm, community-first, expert-but-approachable'
      - 'Recommends palette: matte orange + sage green from database'
      - 'Recommends typography pairing: Inter + Playfair Display'
      - Writes brand-guidelines.md with voice, colors, fonts, do/don'ts
    why_this_example: |
      HearthHut has clear community + warmth positioning that maps cleanly
      to voice and palette decisions; demonstrates the discovery loop.
  input_purpose: '[product-or-company] anchors brand discovery. Without it, voice/palette decisions are
    abstract. The brand artifact feeds all subsequent design-intel commands (logo, cip, design-system).'
  next:
    - logo
    - design-system
    - cip
  related:
    - logo
    - design-system
  errors:
    - If no audience defined → asks before recommending palette/fonts
logo:
  category: design-intel
  purpose: |
    Logo design guidance — 55+ logo styles, color psychology, industry
    conventions, AI generation prompts, and do/don't rules. Produces a
    logo brief, not the logo itself.
  what_it_does: |
    Recommends logo style from 55+ catalog, applies color psychology,
    checks industry conventions, generates AI prompts (DALL-E, Midjourney),
    and writes a logo brief. Does NOT generate the actual logo image.
  input:
    syntax: /healer:logo [brand]
    args:
      - name: brand
        desc: Brand to design a logo for
        required: false
    valid:
      - HearthHut
      - fintech startup, trust-focused
    invalid:
      - text: make my logo
        why: command outputs a brief, not images
  example:
    command: /healer:logo HearthHut
    trace:
      - Reads brand-guidelines.md if present
      - 'Recommends style: wordmark with hearth/flame mark'
      - 'Color psychology: matte orange evokes warmth, sage evokes trust'
      - Generates DALL-E prompt and Midjourney prompt with explicit constraints
      - Writes logo-brief.md
    why_this_example: |
      HearthHut's brand vibe (warmth + trust) maps to specific style and
      color choices, exposing how the catalog informs decisions.
  input_purpose: '[brand] connects logo decisions to brand voice and palette. Without brand context, the
    logo brief is generic. Connects to /healer:icon and /healer:cip downstream.'
  next:
    - icon
    - cip
    - brand
  related:
    - brand
    - cip
  errors:
    - If no brand context → asks for brand-guidelines.md or runs /healer:brand first
cip:
  category: design-intel
  purpose: |
    Corporate Identity Program — 50+ deliverables checklist, mockup
    generation guidance, style guide creation, and brand consistency
    enforcement across all touchpoints.
  what_it_does: |
    Generates a CIP deliverables checklist (business cards, letterhead,
    email signatures, social templates, presentation templates, etc.),
    provides mockup specs, and writes a style guide that codifies
    consistent application of the brand.
  input:
    syntax: /healer:cip [brand]
    args:
      - name: brand
        desc: Brand for the CIP
        required: false
    valid:
      - HearthHut
    invalid:
      - text: ''
        why: needs brand context — run /healer:brand first if missing
  example:
